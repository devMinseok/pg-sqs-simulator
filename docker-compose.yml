services:
  db:
    image: postgres:16-alpine
    container_name: pg-sqs-simulator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sqs_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sqs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
